<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Happy Birthday Iiiikkk 🎂</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="merrywrap" class="merrywrap">

        <canvas id="snowfall"></canvas>

        <!-- GIFT BOX -->
        <div class="giftbox">

            <div class="cover">
                <div></div>
            </div>

            <div class="box"></div>

        </div>


        <!-- BIRTHDAY TEXT -->
        <div class="icons">

            <div class="row dear-row">
                <span>D</span>
                <span>e</span>
                <span>a</span>
                <span>r</span>
                <span class="space">&nbsp;</span>
                <span>P</span>
                <span>a</span>
                <span>c</span>
                <span>a</span>
                <span>r</span>
            </div>

            <div class="row birthday-row">
                <span>H</span>
                <span>a</span>
                <span>p</span>
                <span>p</span>
                <span>y</span>
                <span class="space">&nbsp;</span>
                <span>B</span>
                <span>i</span>
                <span>r</span>
                <span>t</span>
                <span>h</span>
                <span>d</span>
                <span>a</span>
                <span>y</span>
            </div>

            <div class="row wish-row">
                <span>I hope all your wishes come true</span>
            </div>

        </div>


        <!-- CAKE -->
        <div class="cake">

            <div class="plate"></div>

            <div class="layer layer-bottom"></div>
            <div class="layer layer-middle"></div>
            <div class="layer layer-top"></div>

            <div class="icing"></div>

            <div class="drip drip1"></div>
            <div class="drip drip2"></div>
            <div class="drip drip3"></div>

            <div class="candle">
                <div class="flame"></div>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
